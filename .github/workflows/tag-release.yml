# Release chain step 2 of 3 (see release.yml): merging a release/X.Y.Z pull
# request creates the annotated vX.Y.Z tag, once the release build is green
# for the merged head.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@9e296f92996b38683c684b9091ed59cb27562770  # v2.3.0
    with:
      require-build: release.yml
    secrets: inherit
