# Release chain step 2 of 3 (see release.yml): merging a release/X.Y.Z pull
# request creates the annotated vX.Y.Z tag, once the release build is green
# for the merged head.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@f582f06f060e0451b64e94ad6c8830b75984ab8a  # main after #68
    with:
      require-build: release.yml
    secrets: inherit
